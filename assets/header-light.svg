  <text x="32" y="86" class="s" font-size="26" font-weight="700" fill="#1f2328">Senior Quality Engineer <tspan font-weight="400" fill="#59636e">· 10+ years in QA</tspan></text>
  <text x="32" y="114" class="m in d1" font-size="12" fill="#59636e">$ npx run profile --reporter=list</text>
  <g class="in d2"><circle cx="40" cy="146" r="7" fill="none" stroke="#1a7f37" stroke-width="1.5"/><path d="M36.5 146l2.3 2.3 4.4-4.6" fill="none" stroke="#1a7f37" stroke-width="1.6"/><rect x="58" y="134" width="100" height="22" fill="#f6f8fa" stroke="#0969da"/><text x="108" y="150" text-anchor="middle" class="m" font-size="12" fill="#0969da">ai-tooling</text><line x1="158" y1="145" x2="196" y2="145" stroke="#59636e" stroke-dasharray="3 3"/><circle cx="196" cy="145" r="2" fill="#59636e"/><text x="208" y="150" class="m" font-size="13" fill="#1f2328">Claude Code agents that turn requirements and PRs into tests</text></g>
  <g class="in d3"><circle cx="40" cy="176" r="7" fill="none" stroke="#1a7f37" stroke-width="1.5"/><path d="M36.5 176l2.3 2.3 4.4-4.6" fill="none" stroke="#1a7f37" stroke-width="1.6"/><rect x="58" y="164" width="100" height="22" fill="#f6f8fa" stroke="#0969da"/><text x="108" y="180" text-anchor="middle" class="m" font-size="12" fill="#0969da">ci-cd</text><line x1="158" y1="175" x2="196" y2="175" stroke="#59636e" stroke-dasharray="3 3"/><circle cx="196" cy="175" r="2" fill="#59636e"/><text x="208" y="180" class="m" font-size="13" fill="#1f2328">pipelines with AI review, security gates and rollback</text></g>
  <g class="in d4"><circle cx="40" cy="206" r="7" fill="none" stroke="#1a7f37" stroke-width="1.5"/><path d="M36.5 206l2.3 2.3 4.4-4.6" fill="none" stroke="#1a7f37" stroke-width="1.6"/><rect x="58" y="194" width="100" height="22" fill="#f6f8fa" stroke="#0969da"/><text x="108" y="210" text-anchor="middle" class="m" font-size="12" fill="#0969da">frameworks</text><line x1="158" y1="205" x2="196" y2="205" stroke="#59636e" stroke-dasharray="3 3"/><circle cx="196" cy="205" r="2" fill="#59636e"/><text x="208" y="210" class="m" font-size="13" fill="#1f2328">Playwright, Kotlin, TypeScript — built as reference templates</text></g>
  <g class="in d5"><line x1="32" y1="246" x2="808" y2="246" stroke="#59636e" stroke-opacity=".6"/>
  <path d="M32 241v10M808 241v10" stroke="#59636e"/>
  <rect x="380" y="237" width="80" height="18" fill="#f6f8fa"/>
  <text x="420" y="250" text-anchor="middle" class="m" font-size="12" fill="#1a7f37">3 passed</text></g>
