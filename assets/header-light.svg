<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-label="Senior Quality Engineer. AI tooling for QA, CI/CD with AI review, reference test frameworks.">
  <style>
    .s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .in{opacity:0;animation:in .4s ease-out forwards}
    .d1{animation-delay:.2s} .d2{animation-delay:.6s} .d3{animation-delay:1s} .d4{animation-delay:1.4s} .d5{animation-delay:1.9s}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <defs><pattern id="gb" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d0d7de" stroke-width=".6" opacity=".55"/></pattern></defs><rect width="840" height="270" rx="4" fill="#f6f8fa"/><rect width="840" height="270" rx="4" fill="url(#gb)"/>
  <path d="M6 20V6H20" fill="none" stroke="#8b949e" stroke-width="1.5"/><path d="M834 20V6H820" fill="none" stroke="#8b949e" stroke-width="1.5"/><path d="M6 250V264H20" fill="none" stroke="#8b949e" stroke-width="1.5"/><path d="M834 250V264H820" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="32" y="38" class="m" font-size="11" letter-spacing="1.5" fill="#0969da">MAKSIMTRS — PROFILE.SPEC</text>
