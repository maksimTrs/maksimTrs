<svg xmlns="http://www.w3.org/2000/svg" width="420" height="166" viewBox="0 0 420 166" role="img" aria-label="WebQA3: Playwright + TypeScript API and UI tests: layered clients, JSON Schema contracts, UI state seeded via API, live HTML report.">
