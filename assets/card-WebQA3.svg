    .bg{fill:#f6f8fa} .gl{stroke:#d0d7de} .bd{stroke:#d0d7de} .tx{fill:#1f2328} .mu{fill:#59636e} .ac{fill:#0969da} @media (prefers-color-scheme:dark){.bg{fill:#0d1117} .gl{stroke:#30363d} .bd{stroke:#30363d} .tx{fill:#e6edf3} .mu{fill:#8b949e} .ac{fill:#58a6ff}}
