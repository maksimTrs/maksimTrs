<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="mymicroservice-gitlab-cicd: Per-service lanes: only changed services are tested, scanned and deployed to AWS EC2, with health-gated deploys and rollback.">
  <style>
    .s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .in{opacity:0;animation:in .4s ease-out forwards}
    .d1{animation-delay:.2s} .d2{animation-delay:.6s} .d3{animation-delay:1s} .d4{animation-delay:1.4s} .d5{animation-delay:1.9s}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <defs><pattern id="gmymicroser" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#30363d" stroke-width=".6" opacity=".55"/></pattern></defs><rect width="420" height="166" rx="4" fill="#0d1117"/><rect width="420" height="166" rx="4" fill="url(#gmymicroser)"/>
  <text x="20" y="32" class="m" font-size="11" letter-spacing="1.5" fill="#58a6ff">CI/CD · GITLAB</text>
  <text x="20" y="58" class="s" font-size="17" font-weight="700" fill="#e6edf3">mymicroservice-gitlab-cicd</text>
  <text y="84" class="m" font-size="12" fill="#8b949e"><tspan x="20" dy="0">Per-service lanes: only changed services are tested,</tspan><tspan x="20" dy="18">scanned and deployed to AWS EC2, with health-gated</tspan><tspan x="20" dy="18">deploys and rollback.</tspan></text>
  <line x1="20" y1="136" x2="400" y2="136" stroke="#30363d"/>
  <rect x="20" y="145" width="10" height="10" fill="#F1E05A"/><text x="38" y="154" class="m" font-size="11" fill="#8b949e">JavaScript</text>
  <text x="400" y="154" text-anchor="end" class="m" font-size="11" fill="#58a6ff">VIEW REPO →</text>
</svg>
